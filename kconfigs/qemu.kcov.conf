CONFIG_STAGING=y
CONFIG_ION=y
CONFIG_ION_UNMAPPED_HEAP=y
CONFIG_ANDROID=y
CONFIG_ANDROID_TIMED_OUTPUT=n
CONFIG_ANDROID_LOW_MEMORY_KILLER=n
### Enabling PREEMPT and disabling JFFS2_FS prevents random failures of
### "make check" in Travis CI
### TODO(GR-XXXX): Re-enabling PREEMPT once bug of linux hang is fixed.
CONFIG_PREEMPT=y
CONFIG_JFFS2_FS=n
### Enable 9P VFS
CONFIG_NET_9P=y
CONFIG_NET_9P_VIRTIO=y
CONFIG_9P_FS=y
CONFIG_9P_FS_POSIX_ACL=y
### CONFIG_TRUSTY=y
CONFIG_NEBULA=y
CONFIG_PRINTK_TIME=y
CONFIG_DYNAMIC_DEBUG=y
# OKL-HYP
### CONFIG_TRUSTY_VIRQ_SIMULATION=y
CONFIG_NEBULA_VIRQ_SIMULATION=y

CONFIG_VIRTIO_INPUT=y
CONFIG_DRM=y
CONFIG_DRM_VIRTIO_GPU=y
CONFIG_NEBULA_TUI=y
CONFIG_NEBULA_SECCAM_ION=y
# CONFIG_NEBULA_SECCAM_ION_WRITEABLE=y
CONFIG_NEBULA_HAL_GENERIC=y

CONFIG_LOG_BUF_SHIFT=20

# syzkaller
CONFIG_KCOV=y
CONFIG_KCOV_INSTRUMENT_ALL=y
CONFIG_DEBUG_INFO=y
